name: ATLAS
version: 2
path_mode: relative
zip_safe: true

policies:
  portable_paths_only: true
  runtime_state_outside_repos: true
  secrets_in_exports_by_default: false
  repo_roots_are_source_only: true

paths:
  root: .
  repos: repos
  runtime: runtime
  data: data
  packages: packages
  docs: docs
  ops: ops
  tmp: tmp
  secrets: secrets

path_contract:
  repos: source repositories and repo-owned source files only
  runtime: non-secret runtime state that must survive a session
  data: retained imports, fixtures, and durable non-secret data assets
  packages: explicit bundles, releases, patches, and prebuilt exports
  docs: stack-level architecture, standards, audits, and runbooks
  ops: shared bootstrap, validation, and operator scripts
  tmp: disposable logs, captures, previews, and scratch outputs
  secrets: machine-local secrets and secret templates only

subpaths:
  runtime:
    atlas: runtime/atlas
    atlas_sessions: runtime/atlas/sessions
    codex: runtime/codex
    cortex: runtime/cortex
    cortex_artifacts: runtime/cortex/artifacts
    cortex_catalog: runtime/cortex/catalog
    cortex_knowledge: runtime/cortex/catalog/knowledge
    cortex_memory: runtime/cortex/catalog/memory
    cortex_playbooks: runtime/cortex/catalog/playbooks
    cortex_query: runtime/cortex/query
    cortex_query_knowledge: runtime/cortex/query/knowledge
    cortex_context: runtime/cortex/context
    cortex_supervisor: runtime/cortex/supervisor
    devservers: runtime/devservers
    events: runtime/receipts/events
    knowledge_receipts: runtime/receipts/knowledge
    lifeline: runtime/lifeline
    lifeline_worker_execution: runtime/lifeline/worker-execution
    playbook: runtime/playbook
    receipts: runtime/receipts
    state: runtime/state
  data:
    fixtures: data/fixtures
    knowledge: data/imports/knowledge
    playbooks: data/imports/playbooks
    imports: data/imports
    exports: data/exports
  packages:
    bundles: packages/bundles
    patches: packages/patches
    prebuilt: packages/prebuilt
    releases: packages/releases
    snapshots: packages/snapshots
  docs:
    architecture: docs/architecture
    audits: docs/audits
    codex: docs/codex
    knowledge: docs/knowledge
    knowledge_promotions: docs/knowledge/promotions
    ops: docs/ops
    playbooks: docs/playbooks
    research: docs/research
    runbooks: docs/runbooks
    standards: docs/standards
  ops:
    backup: ops/backup
    bootstrap: ops/bootstrap
    codex: ops/codex
    cortex: ops/cortex
    doctor: ops/doctor
    events: ops/events
    knowledge: ops/knowledge
    stack: ops/stack
    scripts: ops/scripts
    validation: ops/validation
  tmp:
    captures: tmp/captures
    logs: tmp/logs
    previews: tmp/previews
    scratch: tmp/scratch
  secrets:
    local: secrets/local
    templates: secrets/templates

repo_registry:
  stack:
    path: .
    role: operator-layer
    status: active
  _stack:
    path: repos/_stack
    role: workflow-operator
    status: active
  atlas:
    path: repos/fawxzzy-atlas
    role: architecture-truth
    status: active
  playbook:
    path: repos/fawxzzy-playbook
    role: governance-runtime
    status: active
  lifeline:
    path: repos/fawxzzy-lifeline
    role: local-operator
    status: active
  fitness:
    path: repos/fawxzzy-fitness
    role: application
    status: active
  mazer:
    path: repos/fawxzzy-mazer
    role: application
    status: active
  nat1-games:
    path: repos/Nat1-Games/nat1-games
    role: application
    status: incubating
  playbook-demo:
    path: repos/playbook-demo/playbook-demo
    role: demo
    status: demo
  playbook-v1:
    path: repos/playbook-old/playbookv1
    role: legacy-governance
    status: legacy
  mazer-unreal:
    path: repos/mazer-legacy-unreal/Mazer
    role: legacy-application
    status: legacy

subsystem_registry:
  cortex:
    path: runtime/cortex
    owner: stack
    role: read-only coordination runtime
    status: active
    model: root-owned-subsystem
    adjacent_snapshot: repos/cortex

archives:
  backups: repos/repo-backups
  media:
    - repos/Realm Blade
    - repos/Hard Pill To Swallow
  zip_snapshots:
    - repos/CORTEX-AND-PLAYBOOK-20260408.zip
    - repos/dev.zip
    - repos/mazer-legacy-unreal.zip

export_defaults:
  source_snapshot_root: packages/snapshots
  patch_root: packages/patches
  bundle_root: packages/bundles
  release_root: packages/releases
  prebuilt_root: packages/prebuilt
  include:
    - repos/**
    - docs/**
    - ops/**
    - stack.yaml
    - stack.lock.yaml
    - README-STACK.md
    - AGENTS.md
  exclude:
    - secrets/**
    - runtime/**
    - tmp/**
    - repos/.vercel/**
    - repos/**/.env
    - repos/**/.env.*
    - repos/**/.next/**
    - repos/**/node_modules/**
    - repos/**/dist/**
    - repos/**/coverage/**
    - repos/**/playwright-report/**
    - repos/**/test-results/**

stack_lock:
  path: stack.lock.yaml
  include_repo_ids:
    - stack
    - _stack
    - atlas
    - playbook
    - lifeline
    - fitness
    - mazer
    - nat1-games
    - playbook-demo
  repo_overrides:
    stack:
      trust_class: trusted
      release_eligible: false
    _stack:
      trust_class: trusted
      release_eligible: false
    atlas:
      trust_class: trusted
      release_eligible: true
    playbook:
      trust_class: trusted
      release_eligible: true
    lifeline:
      trust_class: trusted
      release_eligible: true
    fitness:
      trust_class: trusted
      release_eligible: true
    mazer:
      trust_class: trusted
      release_eligible: true
    nat1-games:
      trust_class: trusted
      release_eligible: false
    playbook-demo:
      trust_class: trusted
      release_eligible: false
  excluded_surfaces:
    verta_core_checkout:
      path: repos/Verta-Core
      trust_class: untrusted
      release_eligible: false
      reason: Token-bearing Verta checkout remains quarantined and untrusted until scrub and rotation are complete.
    verta_core_archive:
      path: repos/Verta-Core.zip
      trust_class: untrusted
      release_eligible: false
      reason: Token-bearing Verta archive remains quarantined private evidence and must stay out of release sets.

session_defaults:
  root_agents: AGENTS.md
  repo_agents_name: AGENTS.md
  repo_config_template: docs/codex/CONFIG-TEMPLATE.toml
  global_agents_proposal: docs/codex/GLOBAL-AGENTS.proposed.md
