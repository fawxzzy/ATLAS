name: ATLAS
version: 2
path_mode: relative
zip_safe: true

policies:
  portable_paths_only: true
  runtime_state_outside_repos: true
  secrets_in_exports_by_default: false
  repo_roots_are_source_only: true

paths:
  root: .
  repos: repos
  runtime: runtime
  data: data
  packages: packages
  docs: docs
  ops: ops
  tmp: tmp
  secrets: secrets

path_contract:
  repos: source repositories and repo-owned source files only
  runtime: non-secret runtime state that must survive a session
  data: retained imports, fixtures, and durable non-secret data assets
  packages: explicit bundles, releases, patches, and prebuilt exports
  docs: stack-level architecture, standards, audits, and runbooks
  ops: shared bootstrap, validation, and operator scripts
  tmp: disposable logs, captures, previews, and scratch outputs
  secrets: machine-local secrets and secret templates only

subpaths:
  runtime:
    atlas: runtime/atlas
    atlas_sessions: runtime/atlas/sessions
    codex: runtime/codex
    cortex: runtime/cortex
    cortex_artifacts: runtime/cortex/artifacts
    cortex_catalog: runtime/cortex/catalog
    cortex_knowledge: runtime/cortex/catalog/knowledge
    cortex_memory: runtime/cortex/catalog/memory
    cortex_playbooks: runtime/cortex/catalog/playbooks
    cortex_query: runtime/cortex/query
    cortex_query_knowledge: runtime/cortex/query/knowledge
    cortex_context: runtime/cortex/context
    cortex_supervisor: runtime/cortex/supervisor
    devservers: runtime/devservers
    events: runtime/receipts/events
    knowledge_receipts: runtime/receipts/knowledge
    lifeline: runtime/lifeline
    lifeline_worker_execution: runtime/lifeline/worker-execution
    playbook: runtime/playbook
    receipts: runtime/receipts
    state: runtime/state
  data:
    fixtures: data/fixtures
    knowledge: data/imports/knowledge
    playbooks: data/imports/playbooks
    imports: data/imports
    exports: data/exports
  packages:
    bundles: packages/bundles
    patches: packages/patches
    prebuilt: packages/prebuilt
    releases: packages/releases
    snapshots: packages/snapshots
  docs:
    architecture: docs/architecture
    audits: docs/audits
    codex: docs/codex
    knowledge: docs/knowledge
    knowledge_promotions: docs/knowledge/promotions
    ops: docs/ops
    playbooks: docs/playbooks
    registry: docs/registry
    research: docs/research
    runbooks: docs/runbooks
    standards: docs/standards
  ops:
    atlas: ops/atlas
    backup: ops/backup
    bootstrap: ops/bootstrap
    codex: ops/codex
    cortex: ops/cortex
    doctor: ops/doctor
    events: ops/events
    knowledge: ops/knowledge
    stack: ops/stack
    scripts: ops/scripts
    validation: ops/validation
  tmp:
    captures: tmp/captures
    logs: tmp/logs
    previews: tmp/previews
    scratch: tmp/scratch
  secrets:
    local: secrets/local
    templates: secrets/templates

repo_registry:
  stack:
    path: .
    role: operator-layer
    status: active
  _stack:
    path: repos/_stack
    role: workflow-operator
    status: active
  playbook:
    path: repos/fawxzzy-playbook
    role: governance-runtime
    status: active
  lifeline:
    path: repos/fawxzzy-lifeline
    role: local-operator
    status: active
  foundation:
    path: repos/fawxzzy-foundation
    role: package
    status: active
  fitness:
    path: repos/fawxzzy-fitness
    role: application
    status: unmanaged
  mazer:
    path: repos/fawxzzy-mazer
    role: application
    status: active
  trove:
    path: repos/fawxzzy-trove
    role: application
    status: active
  stream:
    path: repos/fawxzzy-stream
    role: application
    status: incubating
  nat1-games:
    path: repos/Nat1-Games/nat1-games
    role: application
    status: incubating
  playbook-demo:
    path: repos/playbook-demo/playbook-demo
    role: demo
    status: demo

subsystem_registry:
  cortex:
    path: runtime/cortex
    owner: stack
    role: read-only coordination runtime
    status: active
    model: root-owned-subsystem

archives:
  archive_register: docs/registry/ATLAS-ARCHIVE-REGISTRY.json
  admission_runbook: docs/ops/ATLAS-ARCHIVE-ADMISSION-RUNBOOK.md
  intake_policy: manifest_first_selective_ingest
  backups: repos/repo-backups
  canonical_backup_roots:
    bundles: packages/bundles
    patches: packages/patches
  media:
    - repos/Realm Blade
    - repos/Hard Pill To Swallow
  zip_snapshot_root: packages/snapshots
  zip_snapshots:
    - repos/CORTEX-AND-PLAYBOOK-20260408.zip
    - repos/dev.zip
    - repos/mazer-legacy-unreal.zip

export_defaults:
  source_snapshot_root: packages/snapshots
  patch_root: packages/patches
  bundle_root: packages/bundles
  release_root: packages/releases
  prebuilt_root: packages/prebuilt
  include:
    - repos/**
    - docs/**
    - ops/**
    - .github/workflows/**
    - stack.yaml
    - stack.lock.yaml
    - README-STACK.md
    - AGENTS.md
  exclude:
    - secrets/**
    - runtime/**
    - tmp/**
    - repos/.vercel/**
    - repos/**/.env
    - repos/**/.env.*
    - repos/**/.next/**
    - repos/**/node_modules/**
    - repos/**/dist/**
    - repos/**/coverage/**
    - repos/**/playwright-report/**
    - repos/**/test-results/**

stack_lock:
  path: stack.lock.yaml
  include_repo_ids:
    - stack
    - _stack
    - playbook
    - lifeline
    - foundation
    - mazer
    - trove
    - stream
    - nat1-games
    - playbook-demo
  repo_overrides:
    stack:
      trust_class: trusted
      release_eligible: false
    _stack:
      trust_class: trusted
      release_eligible: false
    playbook:
      trust_class: trusted
      release_eligible: true
    lifeline:
      trust_class: trusted
      release_eligible: true
    foundation:
      trust_class: trusted
      release_eligible: true
    mazer:
      trust_class: trusted
      release_eligible: true
    trove:
      trust_class: trusted
      release_eligible: true
    stream:
      trust_class: trusted
      release_eligible: false
    nat1-games:
      trust_class: trusted
      release_eligible: false
    playbook-demo:
      trust_class: trusted
      release_eligible: false
  excluded_surfaces:
    cortex_adjacent_checkout:
      path: repos/fawxzzy-cortex
      trust_class: adjacent
      release_eligible: false
      reason: Cortex checkout is present in the workspace as an adjacent repo but is not yet a governed ATLAS child-repo adoption target.
    fitness_reclone_recovery_checkout:
      path: repos/fawxzzy-fitness.reclone.20260502-195639
      trust_class: untrusted
      release_eligible: false
      reason: Fitness reclone remains a historical recovery checkout outside the canonical child repo and should not count as active stack adoption.
    fitness_recovered_checkout:
      path: repos/fawxzzy-fitness-recovered
      trust_class: untrusted
      release_eligible: false
      reason: Fitness recovered checkout remains a non-canonical recovery lane outside the governed child-repo release surface.
    lifeline_operator_evidence_worktree:
      path: repos/fawxzzy-lifeline-operator-evidence
      trust_class: trusted
      release_eligible: false
      reason: Lifeline operator evidence is a branch worktree of the registered lifeline repo and remains a temporary non-canonical evidence lane outside the governed repo surface.
    trove_release_cutover_worktree:
      path: repos/fawxzzy-trove-release-cutover
      trust_class: trusted
      release_eligible: false
      reason: Trove release cutover is a branch worktree of the registered trove repo and remains a temporary non-canonical cutover lane outside the governed repo surface.
    atlas_adjacent_checkout:
      path: repos/ATLAS
      trust_class: adjacent
      release_eligible: false
      reason: Local ATLAS sibling checkout remains an adjacent non-canonical repo root and is not part of the governed stack member set.
    fitness_parity_recovery_adjacent_checkout:
      path: repos/fawxzzy-fitness-parity-recovery
      trust_class: adjacent
      release_eligible: false
      reason: Fitness parity recovery checkout remains an adjacent recovery surface and is excluded from the governed stack topology.
    fitness_recovered_adjacent_checkout:
      path: repos/fawxzzy-fitness-recovered
      trust_class: adjacent
      release_eligible: false
      reason: Fitness recovered checkout remains an adjacent recovery surface and is excluded from the governed stack topology.
    fitness_reclone_adjacent_checkout:
      path: repos/fawxzzy-fitness.reclone.20260502-195639
      trust_class: adjacent
      release_eligible: false
      reason: Fitness reclone checkout remains an adjacent recovery surface and is excluded from the governed stack topology.
    repo_backups_archive_surface:
      path: repos/repo-backups
      trust_class: trusted
      release_eligible: false
      reason: Legacy bundle and patch backup drop remains visible for recovery provenance but is not a source repo surface and should converge on packages/bundles and packages/patches.
    playbook_codex_adjacent_checkout:
      path: repos/fawxzzy-playbook-codex
      trust_class: adjacent
      release_eligible: false
      reason: Local Playbook Codex checkout remains an adjacent non-canonical helper surface outside the governed stack member set.
    cortex_playbook_snapshot_archive:
      path: repos/CORTEX-AND-PLAYBOOK-20260408.zip
      trust_class: untrusted
      release_eligible: false
      reason: Mixed-owner snapshot reference remains manifest-visible for provenance only and must not be treated as owner truth before owner-split review.
    dev_workspace_snapshot_archive:
      path: repos/dev.zip
      trust_class: untrusted
      release_eligible: false
      reason: Generic legacy workspace snapshot remains manifest-visible for provenance only and must stay out of normal repo and release flows until cataloged.
    zachariahredfield_adjacent_checkout:
      path: repos/ZachariahRedfield
      trust_class: adjacent
      release_eligible: false
      reason: Local ZachariahRedfield checkout remains an adjacent personal repo root and is not part of the governed stack member set.
    verta_core_checkout:
      path: repos/Verta-Core
      trust_class: untrusted
      release_eligible: false
      reason: Token-bearing Verta checkout remains quarantined and untrusted until scrub and rotation are complete.
    verta_core_archive:
      path: repos/Verta-Core.zip
      trust_class: untrusted
      release_eligible: false
      reason: Token-bearing Verta archive remains quarantined private evidence and must stay out of release sets.
    zachariah_redfield_adjacent_checkout:
      path: repos/ZachariahRedfield
      trust_class: adjacent
      release_eligible: false
      reason: ZachariahRedfield checkout is an adjacent unmanaged repo and is outside the governed ATLAS release surface.

session_defaults:
  root_agents: AGENTS.md
  repo_agents_name: AGENTS.md
  repo_config_template: docs/codex/CONFIG-TEMPLATE.toml
  global_agents_proposal: docs/codex/GLOBAL-AGENTS.proposed.md
