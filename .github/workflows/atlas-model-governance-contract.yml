name: Atlas Model Governance Contract

on:
  pull_request:
    paths:
      - ".github/workflows/atlas-model-governance-contract.yml"
      - "docs/ops/ATLAS-MODEL-USAGE-AND-BOUNDED-WORKER-CONTRACT.md"
      - "docs/registry/ATLAS-EXECUTION-PROFILES.v1.json"
      - "ops/atlas/execution_profile_resolver.py"
      - "schemas/atlas.execution-observation.v1.json"
      - "schemas/atlas.execution-profile.registry.v1.json"
      - "tests/fixtures/atlas-model-governance/**"
      - "tests/test_atlas_model_governance_contract.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-governance-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run model governance contract tests
        shell: bash
        run: python -m unittest tests.test_atlas_model_governance_contract -v
